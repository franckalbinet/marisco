# Declarative Intake Architecture handler skeleton
# Full policy: /INTAKE_GOVERNANCE.md

handler:
  module_name: handlers.my_dataset
  title: "My Dataset YYYY"
  description: "Short dataset description."

data_source:
  url: "https://zenodo.org/records/XXXXXXX/files/my_data.csv?download=1"
  fname_out: "my_dataset.nc"
  zenodo_id: "XXXXXXX"
  format: csv

# WARNING: Logical mapping only. Physical cleaning belongs in _loader.py.
columns:
  Latitude_degN: LAT
  Longitude_degE: LON
  Date: TIME
  Station: STATION
  Sample_ID: SMP_ID_PROVIDER

nomenclatures:
  nuclide_lut: {Cs137: 2}
  unit_lut: {Bq_kg: 1}
  lab_lut: {UNSET: 0}
  lab_constants: {}
  area_default: 0

output:
  keywords: [radionuclides, seawater]
  global_attrs:
    title: "My Dataset YYYY"
    summary: "Boundary-cleaned dataset summary."
    metadata_link: "https://zenodo.org/records/XXXXXXX"


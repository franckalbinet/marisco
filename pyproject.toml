[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marisco"
dynamic = ["version"]
description = "MARIS companion package and tutorials"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Franck Albinet, Niall Murphy", email = "franckalbinet@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'netcdf', 'marine', 'radioactivity', 'data']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['pandas', 'openpyxl', 'fastcore>=2.1.16', 'rich', 'tqdm', 'netcdf4', 'tomli', 'tomli-w', 'shapely', 'pyzotero', 'jellyfish', 'requests', 'pyarrow', 'gevent>=22.10.2', 'gsw']

[project.urls]
Repository = "https://github.com/franckalbinet/marisco"
Documentation = "https://franckalbinet.github.io/marisco"

[project.entry-points.nbdev]
marisco = "marisco._modidx:d"

[project.optional-dependencies]
dev = ['nbdev', 'ipykernel', 'twine', 'toolslm']

[project.scripts]
marisco-ingest = "marisco.cli.ingest:main"
marisco-export = "marisco.cli.export:main"

[tool.setuptools.dynamic]
version = {attr = "marisco.__version__"}

[tool.setuptools.packages.find]
include = ["marisco", "marisco.*"]

[tool.setuptools.package-data]
marisco = ["files/lut/*.xlsx", "files/nc/*.nc"]

[tool.nbdev]
custom_sidebar = true
